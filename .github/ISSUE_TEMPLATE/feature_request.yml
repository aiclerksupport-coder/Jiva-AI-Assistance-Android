name: Feature request
description: Propose a practical, safe Jiva AI improvement.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Flutter UI and accessibility
        - Voice, speech or multilingual
        - Local reminders or offline features
        - Android phone workflows
        - Documentation and developer experience
        - Kotlin prototype
    validations:
      required: true
  - type: textarea
    id: need
    attributes:
      label: User need
      description: What real problem would this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Suggested behavior
      description: Include expected permissions, user confirmations and offline behavior.
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: Privacy, security and regression risks
      description: Describe any additional permissions or third-party data handling.
