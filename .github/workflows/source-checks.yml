name: Jiva source checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-android:
    name: Kotlin Android compile and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android API 35
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "platforms;android-36" "build-tools;35.0.0"
      - name: Generate native Gradle wrapper (8.9)
        run: gradle wrapper --gradle-version 8.9 --distribution-type bin
      - name: Preserve generated Gradle wrapper for repository verification
        uses: actions/upload-artifact@v4
        with:
          name: jiva-native-generated-wrapper
          path: |
            gradlew
            gradlew.bat
            gradle/wrapper/gradle-wrapper.jar
            gradle/wrapper/gradle-wrapper.properties
          if-no-files-found: error
      - name: Compile, test and assemble debug APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: jiva-native-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  flutter:
    name: Dart analysis and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.9'
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Create Flutter launcher resources and wrapper
        working-directory: flutter
        run: flutter create . --platforms android --project-name jiva_assistance
      - name: Flutter dependencies
        working-directory: flutter
        run: flutter pub get
      - name: Dart static analysis
        working-directory: flutter
        run: flutter analyze --no-fatal-infos
      - name: Flutter tests
        working-directory: flutter
        run: flutter test

      - name: Build Flutter debug APK
        working-directory: flutter
        run: flutter build apk --debug
      - name: Upload Flutter debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: jiva-flutter-debug-apk
          path: flutter/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
