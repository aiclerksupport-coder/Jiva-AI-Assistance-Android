name: jiva_assistance
description: Flutter counterpart to the Jiva Android assistant.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  app_settings: ^5.1.1
  audioplayers: ^6.8.1
  file_picker: ^11.0.3
  flutter:
    sdk: flutter
  flutter_foreground_task: ^11.0.3
  flutter_local_notifications: ^18.0.1
  flutter_native_contact_picker: ^0.0.13
  flutter_secure_storage: ^9.2.2
  flutter_tts: ^4.2.0
  http: ^1.2.2
  image_picker: ^1.1.2
  installed_apps: ^2.2.1
  jiva_accessibility:
    path: packages/jiva_accessibility
  path_provider: ^2.1.6
  porcupine_flutter: ^4.0.0
  share_plus: ^10.1.4
  speech_to_text: ^7.0.0
  timezone: ^0.10.0
  url_launcher: ^6.3.1
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
