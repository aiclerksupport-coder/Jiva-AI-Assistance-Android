name: jiva_accessibility
description: Android screen assistance and enhanced voice input for Jiva.
version: 1.0.0
publish_to: none

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.jiva.accessibility
        pluginClass: JivaAccessibilityPlugin
